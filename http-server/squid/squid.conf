# Allow local network segment access
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
http_access allow localnet
http_access allow localhost

# Proxy Port
http_port 3128

# Cache settings
# 5000 represents 5GB of space, adjust according to your disk size
cache_dir ufs /var/spool/squid 5000 16 256
maximum_object_size 1 GB
cache_mem 512 MB

# Cache policy: force cache for common compressed file formats
refresh_pattern \.(zip|gz|tar|tgz|bz2|7z)$ 43200 100% 43200 override-expire ignore-no-cache ignore-no-store
refresh_pattern . 1440 20% 10080
